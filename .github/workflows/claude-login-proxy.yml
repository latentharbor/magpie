name: Standalone Claude proxy
on:
  push:
    branches: [feat/standalone-claude-proxy-20261113]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-proxy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format on CI
        run: |
          gofmt -w cmd/claude-login-proxy internal/claudeproxy internal/claudelogin
          git diff -- '*.go' > "$RUNNER_TEMP/proxy-format.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-format
          path: ${{ runner.temp }}/proxy-format.patch
      - name: Formatting is committed
        run: test ! -s "$RUNNER_TEMP/proxy-format.patch"
  verify:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Independent dependency boundary
        run: |
          go list -deps ./cmd/claude-login-proxy > "$RUNNER_TEMP/dependencies"
          if grep -E '^github.com/yetone/magpie/(internal/(gateway|provider|gui|claudeteam|settings)|plugins)(/|$)' "$RUNNER_TEMP/dependencies"; then exit 1; fi
          go vet ./internal/claudeproxy ./cmd/claude-login-proxy
          python3 -m py_compile build/claude-login-proxy/install.py
      - name: Proxy, MCP, credentials, draining and import
        run: |
          go test -race -count=20 -timeout 8m ./internal/claudeproxy
          go test -race -timeout 8m ./internal/claudelogin
      - name: Drain regression remains detectable
        if: runner.os == 'Linux'
        run: |
          cp internal/claudeproxy/daemon.go "$RUNNER_TEMP/daemon.go"
          trap 'cp "$RUNNER_TEMP/daemon.go" internal/claudeproxy/daemon.go' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/claudeproxy/daemon.go');s=p.read_text()
          old='for a.active != 0 {'
          assert s.count(old)==1
          p.write_text(s.replace(old,'for false && a.active != 0 {'))
          PY
          if go test -timeout 30s ./internal/claudeproxy -run '^TestStandaloneDrainRejectsNewCallsAndWaitsForBody$' > "$RUNNER_TEMP/negative.log" 2>&1; then
            cat "$RUNNER_TEMP/negative.log"
            exit 1
          fi
          grep -F 'drain ended with a live stream' "$RUNNER_TEMP/negative.log"
  build:
    needs: verify
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and sign the two macOS clients
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 amd64; do
            dir="$RUNNER_TEMP/client-$arch"
            mkdir -p "$dir"
            GOARCH="$arch" CGO_ENABLED=1 go build -trimpath -ldflags '-s -w -X main.version=0.1.0' -o "$dir/claude-login-proxy" ./cmd/claude-login-proxy
            codesign --force --sign - "$dir/claude-login-proxy"
            codesign --verify --strict "$dir/claude-login-proxy"
            cp build/claude-login-proxy/README.md build/claude-login-proxy/install.py build/claude-login-proxy/*.command "$dir/"
            chmod 755 "$dir/"*.command "$dir/claude-login-proxy"
            ditto -c -k --keepParent "$dir" "dist/claude-login-proxy-0.1.0-darwin-$arch.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-clients
          path: dist/*
  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-clients
          path: dist
      - name: Sign the independent client manifest
        env:
          FORK_RELEASE_PRIVATE_KEY: ${{ secrets.FORK_RELEASE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('dist');assets={}
          for p in sorted(root.glob('*.zip')):
            b=p.read_bytes();assets[p.name]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          assert len(assets)==2
          (root/'latest.json').write_text(json.dumps({'product':'claude-login-proxy','version':'0.1.0','sourceCommit':os.environ['GITHUB_SHA'],'assets':assets},indent=2)+'\n')
          PY
          python3 build/fork_release.py sign dist
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-signed
          path: dist/*
