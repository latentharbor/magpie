name: Distribution maintenance notices

on:
  workflow_run:
    workflows: [Distribution release]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: distribution-maintenance-notices
  cancel-in-progress: false

jobs:
  notice:
    if: >-
      github.repository == 'latentharbor/magpie' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/build/fork_notice.cjs`)(
              github, context, 'release', context.payload.workflow_run.conclusion !== 'success'
            );
