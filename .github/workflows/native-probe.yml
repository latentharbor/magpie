name: Native acceptance diagnosis
on:
  workflow_dispatch:
    inputs:
      negative_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Format fixtures
        run: gofmt -w internal/update/staging_test.go internal/update/rosetta_test.go internal/gui/window_up_darwin_test.go
      - name: Native update checks
        if: ${{ !inputs.negative_only }}
        run: go test -count=1 -timeout 10m ./internal/update
      - name: Repeat native staging and signature checks
        if: ${{ !inputs.negative_only }}
        run: go test -count=20 -timeout 10m ./internal/update -run '^Test(RosettaStagesAppleSiliconsApp|StageUnpacksNoApp|StagingFixtureStillChecksRealSeal|ForkAppUpdateRequiresRealSameSigner)$'
      - name: Repeat window restoration
        if: ${{ !inputs.negative_only }}
        run: go test -count=20 -timeout 15m ./internal/gui -run '^TestCoveredWindowStaysUp$' -v
      - name: Covered-window regression still rejects occlusion as closed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/gui/space_darwin.go')
          text=p.read_text()
          before='func windowUp(w *application.WebviewWindow) bool {\n\tp := w.NativeWindow()\n\treturn p != nil && C.windowUp(p) != 0\n}'
          assert text.count(before)==1
          p.write_text(text.replace(before,'func windowUp(w *application.WebviewWindow) bool { return w.IsVisible() }'))
          PY
          if go test -timeout 2m ./internal/gui -run '^TestCoveredWindowStaysUp$' > /tmp/window-regression.log 2>&1; then
            cat /tmp/window-regression.log
            exit 1
          fi
          cat /tmp/window-regression.log
          grep -E 'window up: (open|covered|hidden with magpie|minimised): the window counts as up=false, want true' /tmp/window-regression.log
