name: Synchronize upstream

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

concurrency:
  group: distribution-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    if: github.repository == 'latentharbor/magpie'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream without discarding local changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already current.'
            exit 0
          fi
          if ! git merge --no-ff --no-edit -m 'maintenance: synchronize upstream' upstream/main; then
            git merge --abort
            echo '::error::Upstream merge conflicts; main was not changed. Resolve and rerun manually.'
            exit 1
          fi
          # A concurrent push is rejected. No force push, reset or conflict preference.
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch is explicit
          # and Test's successful workflow_run event then starts Distribution release.
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Record synchronization failure or recovery
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/build/fork_notice.cjs`)(
              github, context, 'upstream', '${{ job.status }}' !== 'success'
            );
